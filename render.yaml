# Render blueprint — one free web service.
#
# ┌───────────────────────────────────────────────────────────────────────────┐
# │ YOU MUST SET UP AN EXTERNAL CRON. Nothing here schedules anything.        │
# │                                                                           │
# │   POST https://<your-service>.onrender.com/api/internal/sweep?group=all   │
# │   Authorization: Bearer <AUTH_SECRET>                                     │
# │                                                                           │
# │ Every scheduled job lives in the web app under lib/jobs and is reached    │
# │ through that one endpoint. Without a caller: no intent ever expires, no   │
# │ health alert ever fires, and — the one that matters — NO WEBHOOK IS EVER  │
# │ DELIVERED, so your store is never told it has been paid.                  │
# │                                                                           │
# │ Render's own cron is not on the free tier, so use cron-job.org or GitHub  │
# │ Actions. docs/deploy.md covers the interval trade-off against Neon's free │
# │ compute allowance.                                                        │
# └───────────────────────────────────────────────────────────────────────────┘
#
# The other free-tier property worth knowing: this service sleeps after 15
# minutes of inactivity, and a sleeping service cannot receive a payment
# capture. Nothing is lost — the phone retries from its own queue — but the
# buyer waits out the cold start. That is the tier, not a misconfiguration.

services:
  # ── Web: API + dashboard ───────────────────────────────────────────────────
  - type: web
    name: jomma-web
    runtime: node
    region: singapore # Closest Render region to Bangladesh.
    # Free. It sleeps after 15 minutes and takes 30-60 seconds to wake, so a
    # buyer arriving at a cold checkout waits that long. Nothing is lost — the
    # phone retries captures from its own queue — and the keep-alive ping in
    # docs/deploy.md mostly sidesteps it. Upgrade to `starter` ($7/mo) when the
    # wait starts costing more than the plan.
    plan: free
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @jomma/web build
    startCommand: pnpm --filter @jomma/web start
    healthCheckPath: /login
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'

      # Point at whichever Postgres you picked. Neon and Supabase both want
      # sslmode=require in the URL.
      - key: DATABASE_URL
        sync: false
      # Managed Postgres free tiers cap connections hard — Neon's pooler and
      # Supabase's free project both sit well under Postgres defaults.
      - key: DATABASE_POOL_MAX
        value: '5'

      # Generated once by Render. AUTH_SECRET is also the bearer token your
      # external cron presents to /api/internal/sweep, so copy it out of the
      # dashboard after the first deploy.
      - key: AUTH_SECRET
        generateValue: true
      - key: WEBHOOK_SIGNING_SECRET
        generateValue: true

      # The service's own public URL, WITH the scheme.
      #
      # Deliberately not `fromService: property: host`, which yields a bare
      # hostname like `jomma-web.onrender.com`. Everything that reads this needs
      # an absolute URL: Better Auth's origin check rejects a schemeless
      # baseURL, and the cron builds `${APP_URL}/api/internal/sweep`, which
      # without a scheme is not a fetchable URL — so no jobs would run and no
      # webhook would ever be delivered.
      #
      # Set it in the Render dashboard after the first deploy names the service:
      #   https://jomma-web.onrender.com
      - key: APP_URL
        sync: false

      # Signing fingerprint of the notifier APK, published at
      # /.well-known/assetlinks.json. Without it a provisioning QR scanned by
      # the phone's camera app opens a browser instead of the notifier; with it,
      # Android routes the link straight into the app and refuses to let any
      # other app claim it.
      #
      # Set it after building the APK:
      #   keytool -list -v -keystore <your.keystore> -alias <alias>
      - key: ANDROID_CERT_SHA256
        sync: false

      - key: LOG_LEVEL
        value: info
      - key: FEATURE_MESSAGES_BRIDGE
        value: 'false'
