name: CI

# What this run is called in the Actions list.
#
# GitHub's default is the commit subject, which on a release commit gives three
# rows all reading "Release 1.4.2" — the checks, the deployment record, and the
# actual release, indistinguishable. The subtitle underneath already carries the
# workflow name, the commit and who pushed it, so repeating the message in bold
# spends the one customisable line saying nothing.
#
# So each workflow says what it does instead. `head_ref` is the source branch of
# a pull request and empty otherwise, hence the fallback.
run-name: Checks — web and Android, on ${{ github.head_ref || github.ref_name }}

# Everything that must be true before a commit is trusted. Runs on the default
# branch, on pull requests, and on demand — `workflow_dispatch` so a fork can
# prove its own copy builds without opening a pull request first.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push makes the previous run's answer irrelevant. Cancelling keeps the
# free runner minutes for the commit somebody is actually waiting on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web — types, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, because the version guard diffs this push against the
          # commit before it. The default shallow clone does not contain that
          # commit, so the guard would find nothing to compare and skip — which
          # is worse than not having it, since it would look like it passed.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # First, and on its own, because a version mismatch is the one failure
      # that produces a *working* build that lies about what it is.
      - name: Version is consistent
        run: pnpm version:check

      # Everything shipped is versioned
      #
      # Nine commits of tenancy, device approval and multi-number support once
      # went out with VERSION untouched, so no tag was cut and no APK was ever
      # built for any of it. A phone reporting 1.3.2 was running code that
      # 1.3.2 never contained.
      #
      # This is the check that would have caught it, and it is deliberately
      # about *shippable* paths only. Docs, workflows and scratch do not need a
      # version; anything that lands on a phone or in the database does.
      - name: Shippable changes carry a version bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/version-guard.mjs ${{ github.event.before }} ${{ github.sha }}

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  android:
    name: Android — tests, debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest

      # Assembling is the real check on the Compose and manifest work — most of
      # this app is UI and resources, which unit tests never touch.
      - name: Build debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug

      - name: Keep the APK for this commit
        uses: actions/upload-artifact@v4
        with:
          name: jomma-notifier-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


  release:
    name: Release the version in VERSION
    needs: [web, android]
    # Only for a real commit landing on the default branch. A pull request has
    # not been merged yet, and dispatching from one would publish a release for
    # code that may never land.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To start the Release workflow. A tag pushed with GITHUB_TOKEN does not
      # trigger workflows -- GitHub blocks that to stop runs recursing -- so the
      # obvious "just push a tag" version of this job would go green and build
      # nothing. Dispatching is the path that actually runs.
      actions: write
    steps:
      - uses: actions/checkout@v4

      # The gap this closes: `version-guard` already refuses a shippable change
      # that does not move VERSION, so the number is always bumped. Nothing made
      # the release happen. 1.4.0 shipped nine commits of features that way --
      # VERSION correct, no tag, no APKs, and the phones never saw it.
      #
      # Idempotent by construction: once the release exists the tag exists, and
      # every later push to main takes the first branch and does nothing.
      - name: Release, if this version has not been released yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(cat VERSION)"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released — nothing to do."
            exit 0
          fi

          echo "$tag has no release yet. Starting the Release workflow."

          # Passing the version rather than letting it re-read VERSION. Same
          # value, but it pins the release to what this run actually tested --
          # main can move between here and the dispatch -- and it gives that run
          # a name, since `run-name` is evaluated before any checkout.
          gh workflow run release.yml --ref main -f version="$(cat VERSION)"
