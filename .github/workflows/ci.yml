name: CI

# Everything that must be true before a commit is trusted. Runs on the default
# branch, on pull requests, and on demand — `workflow_dispatch` so a fork can
# prove its own copy builds without opening a pull request first.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push makes the previous run's answer irrelevant. Cancelling keeps the
# free runner minutes for the commit somebody is actually waiting on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web — types, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, because the version guard diffs this push against the
          # commit before it. The default shallow clone does not contain that
          # commit, so the guard would find nothing to compare and skip — which
          # is worse than not having it, since it would look like it passed.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # First, and on its own, because a version mismatch is the one failure
      # that produces a *working* build that lies about what it is.
      - name: Version is consistent
        run: pnpm version:check

      # Everything shipped is versioned
      #
      # Nine commits of tenancy, device approval and multi-number support once
      # went out with VERSION untouched, so no tag was cut and no APK was ever
      # built for any of it. A phone reporting 1.3.2 was running code that
      # 1.3.2 never contained.
      #
      # This is the check that would have caught it, and it is deliberately
      # about *shippable* paths only. Docs, workflows and scratch do not need a
      # version; anything that lands on a phone or in the database does.
      - name: Shippable changes carry a version bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/version-guard.mjs ${{ github.event.before }} ${{ github.sha }}

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  android:
    name: Android — tests, debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest

      # Assembling is the real check on the Compose and manifest work — most of
      # this app is UI and resources, which unit tests never touch.
      - name: Build debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug

      - name: Keep the APK for this commit
        uses: actions/upload-artifact@v4
        with:
          name: jomma-notifier-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

