name: CI

# Everything that must be true before a commit is trusted. Runs on the default
# branch, on pull requests, and on demand — `workflow_dispatch` so a fork can
# prove its own copy builds without opening a pull request first.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push makes the previous run's answer irrelevant. Cancelling keeps the
# free runner minutes for the commit somebody is actually waiting on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web — types, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # First, and on its own, because a version mismatch is the one failure
      # that produces a *working* build that lies about what it is.
      - name: Version is consistent
        run: pnpm version:check

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  android:
    name: Android — tests, debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest

      # Assembling is the real check on the Compose and manifest work — most of
      # this app is UI and resources, which unit tests never touch.
      - name: Build debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug

      - name: Keep the APK for this commit
        uses: actions/upload-artifact@v4
        with:
          name: jomma-notifier-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  deploy:
    name: Deploy to Render
    # Only after both suites pass. This is the point of driving deploys from
    # here: Render's own "auto-deploy on commit" ships whatever was pushed,
    # green or not, and this service takes people's money.
    needs: [web, android]
    # Pushes to the default branch only. Not pull requests — a fork's PR must
    # never be able to deploy — and not manual runs, which are for checking a
    # branch rather than shipping it.
    if: false && github.event_name == 'push'  # temporarily off: testing Render native
    runs-on: ubuntu-latest
    # `deployments: write` so this job can record the deployment on the commit.
    # Render's GitHub App used to do that, and driving deploys from here took it
    # away — the repository stopped showing where its code was running.
    permissions:
      contents: read
      deployments: write
    steps:
      # Recreates the "production" entry the repository used to show. It is
      # attached to the commit, so the history says which build went live and
      # which did not, rather than only the dashboard knowing.
      - name: Open a deployment on the commit
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -u
          id="$(gh api "repos/$REPO/deployments" --input - --jq '.id' <<EOF
          {
            "ref": "$SHA",
            "environment": "production",
            "description": "Deploy to Render, gated on CI",
            "auto_merge": false,
            "required_contexts": []
          }
          EOF
          )"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          gh api "repos/$REPO/deployments/$id/statuses" \
            -f state=in_progress \
            -f environment_url=https://jomma-web.onrender.com \
            >/dev/null
          echo "deployment $id opened"

      - name: Trigger a deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -u

          # Absent on a fork, and that is not a failure — a fork has no Render
          # service to deploy to. Say so and finish green.
          if [ -z "${HOOK:-}" ]; then
            echo "::notice::No RENDER_DEPLOY_HOOK secret — nothing to deploy to."
            exit 0
          fi

          # `--fail-with-body` so a 4xx is an error rather than a silent green
          # tick, and the body is printed so the reason is visible. The URL
          # itself never reaches the log: it carries its own key.
          if curl --silent --show-error --fail-with-body --max-time 60 \
               -X POST "$HOOK" -o response.json; then
            echo "Deploy requested."
            # Just the id. Enough to find it in Render, and nothing sensitive.
            grep -o '"id":"[^"]*"' response.json | head -1 || true
          else
            echo "::error::Render refused the deploy hook. Response:"
            cat response.json || true
            exit 1
          fi

      - name: Wait for the new build to answer
        env:
          SHA: ${{ github.sha }}
        run: |
          set -u

          # A requested deploy is not a finished one. Render builds this service
          # in roughly two to three minutes on the free plan, and without this
          # check a red build could sit in production while the workflow showed
          # green — which is exactly the failure this job exists to prevent.
          #
          # /api/health reports the commit the running build was made from, so
          # "did my commit reach production" has a real answer rather than an
          # assumption.
          want="${SHA:0:7}"
          echo "waiting for $want"

          for i in $(seq 1 40); do
            sleep 15
            got="$(curl -sf --max-time 20 https://jomma-web.onrender.com/api/health \
                    | grep -o '"commit":"[^"]*"' | cut -d'"' -f4 || true)"
            if [ "$got" = "$want" ]; then
              echo "live after ~$((i * 15))s: $got"
              echo "### Deployed \`$want\` to production" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "  ${got:-no response} (want $want)"
          done

          echo "::error::Production never reported $want. Check the deploy in Render."
          exit 1

      # Split by outcome so the commit ends up marked with what actually
      # happened. A deployment left "in progress" forever is worse than none:
      # the repository would claim a deploy is still running days later.
      - name: Mark the deployment live
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ID: ${{ steps.deployment.outputs.id }}
        run: |
          gh api "repos/$REPO/deployments/$ID/statuses" \
            -f state=success \
            -f environment_url=https://jomma-web.onrender.com \
            -f description="Verified live via /api/health" >/dev/null
          echo "deployment $ID marked success"

      - name: Mark the deployment failed
        # `always()` so this still runs when an earlier step failed; without it
        # the job's failure would skip it and leave the deployment in progress.
        if: always() && failure() && steps.deployment.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ID: ${{ steps.deployment.outputs.id }}
        run: |
          gh api "repos/$REPO/deployments/$ID/statuses" \
            -f state=failure \
            -f description="Deploy did not reach production" >/dev/null || true
          echo "deployment $ID marked failure"
