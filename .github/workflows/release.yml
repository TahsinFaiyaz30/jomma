name: Release

# What the run is called in the Actions list.
#
# Without this every dispatched run is just "Release", because GitHub titles a
# run by the commit subject only for push events — a `workflow_dispatch` has no
# commit to name it after and falls back to the workflow's own name. So the one
# run in that list you actually go looking for, the one that built the APKs, was
# the only one that did not say which version it built.
#
# VERSION cannot be read here: `run-name` is evaluated before anything is
# checked out. Hence the input, which CI now passes, with the tag as the
# fallback for a tag push.
run-name: Release ${{ inputs.version || github.ref_name }}

# Publishes the APKs for one commit.
#
# Two ways in:
#   - push a tag: `git tag v1.1.0 && git push origin v1.1.0`
#   - run it by hand from the Actions tab, which is what a fork will use
#
# `workflow_dispatch` matters for forks specifically. A fork gets the workflow
# but not the tags, and its owner should be able to produce an installable APK
# from their own build without pushing a tag or opening a pull request.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release. Defaults to the VERSION file.'
        required: false
        type: string
      publish:
        description: 'Create a GitHub Release. Off = build the APKs only.'
        required: false
        default: true
        type: boolean
      prerelease:
        description: 'Mark the release as a pre-release.'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: pnpm install --frozen-lockfile

      # Nothing is published from a commit that does not pass. A release is the
      # one artefact people install without looking, so the gate belongs here
      # too and not only on the CI workflow.
      - name: Verify
        run: |
          pnpm version:check
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag drives it, so `v1.1.0` and VERSION cannot disagree in what
            # gets published under that name.
            version="${GITHUB_REF_NAME#v}"
            file_version="$(cat VERSION)"
            if [ "$version" != "$file_version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($file_version). Run 'pnpm version:set $version' and commit before tagging."
              exit 1
            fi
          else
            version="${{ inputs.version }}"
            [ -z "$version" ] && version="$(cat VERSION)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      # Absent on a fork, and that is expected rather than an error. Without it
      # the release APK cannot be signed, so only the debug APK — which uses the
      # keystore committed alongside the app — is installable.
      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret — publishing the debug APK only."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jomma-release.jks"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        working-directory: apps/android
        # Passed on the command line rather than written to gradle.properties so
        # the passwords are never on disk in the workspace.
        run: |
          ./gradlew assembleRelease \
            -PjommaKeystore="$RUNNER_TEMP/jomma-release.jks" \
            -PjommaKeystorePassword="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PjommaKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PjommaKeyPassword="${{ secrets.ANDROID_KEY_PASSWORD }}" \
            ${JOMMA_HOST:+-PjommaHost="$JOMMA_HOST"}
        env:
          # Lets a fork build for its own domain. Unset, the default in
          # build.gradle.kts applies.
          JOMMA_HOST: ${{ vars.JOMMA_HOST }}

      - name: Collect APKs
        id: apks
        run: |
          mkdir -p dist
          v="${{ steps.version.outputs.version }}"
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk "dist/jomma-notifier-$v-debug.apk"
          if [ -f apps/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp apps/android/app/build/outputs/apk/release/app-release.apk "dist/jomma-notifier-$v-release.apk"
          fi
          ls -la dist
          # Published alongside the APKs. An APK downloaded from the internet
          # should be checkable against something the build itself recorded.
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Fingerprint the release APK
        if: steps.signing.outputs.available == 'true'
        run: |
          v="${{ steps.version.outputs.version }}"
          apk="dist/jomma-notifier-$v-release.apk"
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)"
          # The value that has to appear in /.well-known/assetlinks.json for
          # provisioning QRs to open in the app rather than a browser. Printing
          # it here means a fork never has to go looking for it.
          "$tools/apksigner" verify --print-certs "$apk" | grep -i "SHA-256 digest" || true

      - uses: actions/upload-artifact@v4
        with:
          name: jomma-notifier-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Publish the release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.available }}
        run: |
          v="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"

          {
            echo "Built from \`${GITHUB_SHA:0:7}\`."
            echo
            echo "| File | What it is |"
            echo "| --- | --- |"
            echo "| \`jomma-notifier-$v-debug.apk\` | Debug build. Not minified, all ABIs, signed with this repository's debug key. For development. |"
            if [ "$SIGNED" = "true" ]; then
              echo "| \`jomma-notifier-$v-release.apk\` | Release build. Minified, arm-only, signed with this project's key. **Install this one.** |"
            fi
            echo "| \`SHA256SUMS.txt\` | Checksums for the above. |"
            echo
            if [ "$SIGNED" != "true" ]; then
              echo "> No signing key was configured, so there is no release APK."
              echo "> Add \`ANDROID_KEYSTORE_BASE64\`, \`ANDROID_KEYSTORE_PASSWORD\`,"
              echo "> \`ANDROID_KEY_ALIAS\` and \`ANDROID_KEY_PASSWORD\` as repository"
              echo "> secrets — see docs/versioning.md."
              echo
            fi
            echo "Provisioning QRs only open straight in the app when the server"
            echo "publishes this APK's signing fingerprint. See docs/android.md."
          } > notes.md

          # Idempotent on purpose: re-running a release should replace its
          # assets rather than fail on the second attempt.
          #
          # `--draft=false` is not redundant. Deleting a tag turns its release
          # into a draft rather than removing it, so the obvious way to re-run
          # a release — delete the tag, push it again — leaves a draft that the
          # upload path would happily fill with assets and never publish. Every
          # step goes green and nothing is released.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --notes-file notes.md --draft=false
          else
            gh release create "$tag" dist/* \
              --title "Jomma $v" \
              --notes-file notes.md \
              ${{ (github.event_name == 'workflow_dispatch' && inputs.prerelease) && '--prerelease' || '' }}
          fi

  # ── The SDK, to npm ────────────────────────────────────────────────────────
  #
  # Separate from the release above rather than a step inside it, for one
  # reason: npm publishes are permanent. A version cannot be replaced, and
  # unpublishing is restricted after 72 hours, so this must not run until the
  # GitHub release it belongs to has actually succeeded — hence `needs`.
  #
  # ## Before this can work
  #
  # `@jomma` is a scope, and npm only accepts a scoped publish from a scope you
  # own. That means one of:
  #
  #   - an npm **organisation** named `jomma` (free for public packages), or
  #   - renaming the package to `@<your-npm-username>/jomma-sdk`.
  #
  # Then create a token that is allowed to publish without a one-time code. A
  # plain login cannot: npm answers an ordinary `pnpm publish` with
  #
  #     403 — Two-factor authentication or granular access token with bypass
  #     2fa enabled is required to publish packages
  #
  # which reads like a permissions problem and is really a missing OTP. Either
  # token type works:
  #
  #   - **Granular access token** — scoped to `@jomma`, read and write, with
  #     **Bypass 2FA** switched on. Expires, so it has to be rotated.
  #   - **Classic automation token** — skips 2FA by design, never expires.
  #
  # Add it to the repository as the `NPM_TOKEN` secret. Publishing by hand
  # instead needs the code appended: `--otp=123456`.
  #
  # Until that secret exists this job skips rather than failing, so adding npm
  # publishing does not retroactively break releases that were fine without it.
  npm:
    name: Publish @jomma/sdk to npm
    needs: [release]
    runs-on: ubuntu-latest
    if: ${{ !failure() && !cancelled() }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # Writes the registry into .npmrc so NODE_AUTH_TOKEN is used.
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Publish, if this version is not already on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "No NPM_TOKEN secret set — skipping. See the comment above this job."
            exit 0
          fi

          v="$(cat VERSION)"

          # Idempotent, the same way the GitHub release above is. Re-running a
          # release must not fail on the second attempt, and npm answers a
          # duplicate version with a 403 that reads like an auth problem.
          if npm view "@jomma/sdk@$v" version > /dev/null 2>&1; then
            echo "@jomma/sdk@$v is already published — nothing to do."
            exit 0
          fi

          # `--no-git-checks`: pnpm otherwise refuses to publish from a detached
          # HEAD, which is exactly what a tag checkout is.
          pnpm publish --filter @jomma/sdk --access public --no-git-checks
